<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Inter', -apple-system, system-ui, sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>

  <rect width="520" height="520" rx="12" fill="#111116"/>

  <text x="180" y="28" text-anchor="middle" fill="#868e96" font-size="11" font-weight="600" letter-spacing="1.5">RETRIEVAL PIPELINE</text>

  <!-- All cards: 280w x 36h, x=40 -->

  <rect x="40" y="44" width="280" height="36" rx="8" fill="#1a1d2e" filter="url(#s)"/>
  <text x="180" y="67" text-anchor="middle" fill="#748ffc" font-size="12" font-weight="600">Query</text>

  <line x1="180" y1="80" x2="180" y2="90" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,88 180,96 184,88" fill="#343a40"/>

  <rect x="40" y="98" width="280" height="36" rx="8" fill="#1c1a2e" filter="url(#s)"/>
  <text x="180" y="121" text-anchor="middle" fill="#9775fa" font-size="12" font-weight="500">Detect type</text>
  <text x="340" y="121" fill="#5c5f66" font-size="9">episodic / semantic / hybrid</text>

  <line x1="180" y1="134" x2="180" y2="144" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,142 180,150 184,142" fill="#343a40"/>

  <text x="340" y="162" fill="#37b24d" font-size="9">episodic → manifest recall</text>

  <rect x="40" y="152" width="280" height="36" rx="8" fill="#1c1a2e" filter="url(#s)"/>
  <text x="180" y="175" text-anchor="middle" fill="#9775fa" font-size="12" font-weight="500">Keyword Search</text>
  <text x="340" y="175" fill="#5c5f66" font-size="9">7d → 30d → 90d → all</text>

  <line x1="180" y1="188" x2="180" y2="198" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,196 180,204 184,196" fill="#343a40"/>

  <rect x="40" y="206" width="280" height="36" rx="8" fill="#1c1a2e" filter="url(#s)"/>
  <text x="180" y="229" text-anchor="middle" fill="#9775fa" font-size="12" font-weight="500">Vector Search + RRF</text>
  <text x="340" y="229" fill="#5c5f66" font-size="9">ChromaDB · rank fusion</text>

  <line x1="180" y1="242" x2="180" y2="252" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,250 180,258 184,250" fill="#343a40"/>

  <rect x="40" y="260" width="280" height="36" rx="8" fill="#1c1a2e" filter="url(#s)" opacity="0.7"/>
  <text x="180" y="283" text-anchor="middle" fill="#9775fa" font-size="12" font-weight="500">LLM Rerank</text>
  <text x="340" y="283" fill="#5c5f66" font-size="9">if ambiguous</text>

  <line x1="180" y1="296" x2="180" y2="306" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,304 180,312 184,304" fill="#343a40"/>

  <rect x="40" y="314" width="280" height="36" rx="8" fill="#2a2416" filter="url(#s)"/>
  <text x="180" y="337" text-anchor="middle" fill="#fcc419" font-size="12" font-weight="500">Spreading Activation</text>
  <text x="340" y="337" fill="#5c5540" font-size="9">[[wikilinks]] 1-2 hops</text>

  <line x1="180" y1="350" x2="180" y2="360" stroke="#343a40" stroke-width="1.5"/>
  <polygon points="176,358 180,366 184,358" fill="#343a40"/>

  <rect x="40" y="368" width="280" height="36" rx="8" fill="#172b1a" filter="url(#s)"/>
  <text x="180" y="391" text-anchor="middle" fill="#69db7c" font-size="12" font-weight="600">Synthesis</text>
  <text x="340" y="391" fill="#3b5f3e" font-size="9">answer with [[citations]]</text>

</svg>
