# Muninn — config file.
#
# Generated by `muninn init`. Edit to customize.
# Secrets (bearer tokens, API keys) go in .env (gitignored).

settings:
  vault_path: ./Muninn-Vault              # path to your Obsidian vault

  # LLM provider: ollama (default), openai, anthropic, openrouter, custom
  # Mix providers per operation: local for ingest, cloud for query
  llm_provider: ollama
  # llm_provider_ingest: ollama           # override for ingest only
  # llm_provider_query: anthropic         # override for query only
  # llm_base_url:                         # custom OpenAI-compatible endpoint

  # Model names — works with any provider
  llm_model: gemma4:e4b                   # default model
  llm_model_ingest: gemma4:e4b            # model for JSON extraction during ingest
  llm_model_query: gemma4:e4b             # model for query synthesis and serve
  llm_timeout: 900                        # seconds before LLM call times out

  # Ollama-specific (only needed when provider is ollama)
  ollama_host: http://localhost:11434
  log_level: WARNING                        # DEBUG | INFO | WARNING | ERROR

  # Context window — how many tokens the model processes per call.
  # Larger = more content per call but slower. Match to your model's capacity.
  num_ctx_ingest: 32768                  # context window for ingest calls
  num_ctx_query: 32768                   # context window for query calls

  # Body limits — max chars of source/page body sent to the LLM.
  # Controls how much of each document the model sees.
  max_body_ingest: 36000                 # chars of raw source body per ingest call
  max_body_query: 8000                   # chars per page body in query context

  # Retrieval — how the query pipeline finds relevant pages.
  # hybrid: keyword + vector search fused via RRF
  # reranked: hybrid + LLM rerank of top candidates
  # adaptive: escalates through tiers + spreading activation (recommended)
  retrieval_mode: adaptive
  max_retrieval_pages: 10                 # page bodies sent to LLM per query (fewer = faster)

  # Two-pass ingest — first pass analyzes, second pass extracts.
  # Better quality but 2x slower. Enable for deeper extraction.
  two_pass_ingest: false

  # Memory model
  consolidation_enabled: true            # enable nightly LLM consolidation
  decay_rate: 0.95                       # weekly strength multiplier (halves in ~14 weeks)
  abstraction_threshold: 5              # source count to trigger definitive rewrite
  archive_threshold: 0.1                # strength below this → lifecycle: stale

sources:

  # ---- Browser history ----
  # Auto-detected by `muninn init`. Reads Chromium SQLite DB, fetches page body.
  - name: chrome-history
    type: browser_history
    enabled: false                       # enable after `muninn init` detects your browser
    url: "file://<path-to-chrome-history>"  # path to Chrome's History sqlite file
    tool: muninn.sources.browser_history:BrowserHistorySource
    options:
      browser: chrome
      min_visit_count: 1                 # skip URLs visited fewer times
      max_items: 500                     # max URLs to fetch per run
      fetch_body: true                   # download and extract page content
      exclude_domains:                   # skip these domains
        - google.com
        - github.com
        - duckduckgo.com
        - bing.com
        - localhost
        - 127.0.0.1

  - name: edge-history
    type: browser_history
    enabled: true
    url: "file://<path-to-edge-history>"
    tool: muninn.sources.browser_history:BrowserHistorySource
    options:
      browser: edge
      min_visit_count: 1
      max_items: 5000
      fetch_body: true
      exclude_domains:
        - google.com
        - github.com
        - duckduckgo.com
        - bing.com
        - localhost
        - 127.0.0.1

  # ---- Firefox ----
  # Auto-detected by `muninn init`. Reads places.sqlite from the default profile.
  - name: firefox-history
    type: browser_history
    enabled: false
    url: "file://<path-to-firefox-profile>/places.sqlite"
    tool: muninn.sources.firefox_history:FirefoxHistorySource
    options:
      min_visit_count: 1
      max_items: 500
      fetch_body: true
      exclude_domains:
        - google.com
        - github.com
        - duckduckgo.com
        - bing.com
        - localhost
        - 127.0.0.1

  # ---- Safari ----
  # Requires Full Disk Access for Terminal (System Settings → Privacy → Full Disk Access).
  - name: safari-history
    type: browser_history
    enabled: false
    url: "file://~/Library/Safari/History.db"
    tool: muninn.sources.safari_history:SafariHistorySource
    options:
      min_visit_count: 1
      max_items: 500
      fetch_body: true
      exclude_domains:
        - google.com
        - github.com
        - duckduckgo.com
        - bing.com
        - localhost
        - 127.0.0.1

  # ---- X (formerly Twitter) ----
  # Requires bearer token from https://developer.x.com
  - name: x-twitter
    type: x
    enabled: false
    url: "https://api.twitter.com/2/users/<user-id>/tweets"
    secret_env: X_BEARER_TOKEN           # reads from .env: X_BEARER_TOKEN=AAAA...
    tool: muninn.sources.x:XSource
    options:
      user_id: "<user-id>"               # numeric user ID (find at twiteridfinder.com)
      handle: "<handle>"                 # your handle without @
      interaction_types: [timeline, liked, replies]  # what to fetch
      max_results: 100
      include_retweets: false

  # ---- Git projects ----
  # Ingests README.md, DESIGN.md etc from local repos → Wiki/Projects/
  - name: git-projects
    type: folder
    enabled: false
    url: "<path-to-git-root>"            # e.g. ~/git
    tool: muninn.sources.folder:FolderSource
    options:
      recursive: true
      max_depth: 3                       # how deep to walk subdirectories
      include_extensions: [.md]
      include_filenames: [README.md, DESIGN.md, CHANGELOG.md]
      exclude_paths: [Muninn-Vault, node_modules, .venv, __pycache__]
      subfolder_as_tag: true             # tag pages by folder name
      page_kind: project                 # creates Wiki/Projects/ pages

  # ---- Claude Code history ----
  # Reads conversations from ~/.claude/projects/
  - name: claude-history
    type: claude-history
    enabled: false
    url: "~/.claude"
    tool: muninn.sources.claude_history:ClaudeHistorySource
    options:
      max_conversations: 20              # most recent N conversations
      min_messages: 3                    # skip short conversations

  # ---- YouTube transcripts ----
  # Extracts spoken content from YouTube videos found in browser history.
  # Complements browser history: browser gets page text, this gets the transcript.
  - name: youtube-transcripts
    type: youtube
    enabled: false
    url: "./Muninn-Vault"                 # vault path (scans Raw/Sources/ for YouTube URLs)
    tool: muninn.sources.youtube:YouTubeTranscriptSource
    options:
      max_videos: 20
      languages: [en]
      raw_sources: [edge-history, chrome-history]  # which browser sources to scan
