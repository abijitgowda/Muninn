[project]
name = "muninn"
version = "0.1.0"
description = "Your local memory. Private by design."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muninn" }]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "trafilatura>=1.10",
  "python-dateutil>=2.9",
  "jinja2>=3.1",
  "ddgs>=7.0",
  "chromadb>=1.0",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
folder = [
  "python-docx>=1.0",
  "openpyxl>=3.1",
]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
all = [
  "muninn[folder,serve]",
]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.5",
  "httpx>=0.27",
]

[project.scripts]
muninn = "muninn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muninn"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "E402", "B008"]  # E402: lazy imports for circular avoidance, B008: typer pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
